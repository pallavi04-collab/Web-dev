<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elegant To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <h1>📝 Daily Planner</h1>
            <p class="subtitle">Organize your tasks beautifully & efficiently</p>

            <div class="input-area">
                <input type="text" id="taskInput" placeholder="What needs to be done?">
                <button id="addTaskBtn">Add</button>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <span id="pendingCount">0</span>
                    <p>Pending</p>
                </div>
                <div class="stat-box">
                    <span id="completedCount">0</span>
                    <p>Completed</p>
                </div>
            </div>

            <ul id="taskList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
