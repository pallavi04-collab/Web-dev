<html lang="en">

                <label class="option">
                    <input type="radio" name="q1">
                    <span>Java</span>
                </label>

                <label class="option">
                    <input type="radio" name="q1">
                    <span>CSS</span>
                </label>

                </label>

            </form>
        </section>

        <!-- Footer -->
        <footer class="quiz-footer">
            <p>✨ Designed using HTML & CSS only</p>
        </footer>

    </main>

</html>
